# Trigger-based template sensor that periodically calls the
# pilotlive.last_transactions_report service and caches the result so it can
# be displayed on a dashboard. Add this under `template:` in
# configuration.yaml (merge with any existing `template:` block).
#
# Replace `sensor.pilotlive_valley_brewery` with your store's entity_id.
template:
  - trigger:
      - trigger: time_pattern
        hours: "/6"
      - trigger: homeassistant
        event: start
    action:
      - action: pilotlive.report
        target:
          entity_id: sensor.pilotlive_valley_brewery
        data:
          from_date: "{{ (now() - timedelta(days=30)).strftime('%Y-%m-%d') }}"
          to_date: "{{ now().strftime('%Y-%m-%d') }}"
        response_variable: report
    sensor:
      - name: PilotLive Valley Brewery Last Transactions
        unique_id: pilotlive_valley_brewery_last_transactions
        state: "{{ now().isoformat() }}"
        attributes:
          rows: "{{ report['sensor.pilotlive_valley_brewery'].rows }}"
