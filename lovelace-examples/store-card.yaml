# Example Lovelace card for a single PilotLive store sensor.
# Replace `sensor.pilotlive_valley_brewery` with your store's entity_id.
type: entities
title: PilotLive Valley Brewery
state_color: true
entities:
  - entity: sensor.pilotlive_valley_brewery
    name: Premium Version
    icon: mdi:store
  - type: attribute
    entity: sensor.pilotlive_valley_brewery
    attribute: "Online"
    name: Online
    icon: mdi:wifi
  - type: attribute
    entity: sensor.pilotlive_valley_brewery
    attribute: "Total Monthly Sales"
    name: Total Monthly Sales
    prefix: "R "
    icon: mdi:cash-multiple
  - type: attribute
    entity: sensor.pilotlive_valley_brewery
    attribute: "Daily Sales"
    name: Daily Sales
    prefix: "R "
    icon: mdi:cash
  - type: attribute
    entity: sensor.pilotlive_valley_brewery
    attribute: "Year on Year"
    name: Year on Year
    suffix: "%"
    icon: mdi:chart-line
  - type: attribute
    entity: sensor.pilotlive_valley_brewery
    attribute: "Projected Growth"
    name: Projected Growth
    suffix: "%"
    icon: mdi:trending-up
  - type: attribute
    entity: sensor.pilotlive_valley_brewery
    attribute: "Open Tables"
    name: Open Tables
    icon: mdi:table-furniture
  - type: attribute
    entity: sensor.pilotlive_valley_brewery
    attribute: "Discounts"
    name: Discounts
    prefix: "R "
    icon: mdi:sale
  - type: attribute
    entity: sensor.pilotlive_valley_brewery
    attribute: "Ticket Claims"
    name: Ticket Claims
    prefix: "R "
    icon: mdi:receipt
  - type: attribute
    entity: sensor.pilotlive_valley_brewery
    attribute: "Voids"
    name: Voids
    prefix: "R "
    icon: mdi:cancel
  - type: attribute
    entity: sensor.pilotlive_valley_brewery
    attribute: "Payouts"
    name: Payouts
    prefix: "R "
    icon: mdi:cash-refund
  - type: attribute
    entity: sensor.pilotlive_valley_brewery
    attribute: "Last Connection"
    name: Last Connection
    icon: mdi:clock-outline
