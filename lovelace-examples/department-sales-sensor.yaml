# Trigger-based template sensor that periodically calls pilotlive.report for
# report_id 22 (Department Sales) and caches the result so it can be charted
# on a dashboard. Add this under `template:` in configuration.yaml (merge
# with any existing `template:` block).
#
# Replace `sensor.pilotlive_valley_brewery` with your store's entity_id.
template:
  - trigger:
      - trigger: time_pattern
        hours: "/6"
      - trigger: homeassistant
        event: start
    action:
      - action: pilotlive.report
        target:
          entity_id: sensor.pilotlive_valley_brewery
        data:
          report_id: 22
          from_date: "{{ now().replace(day=1).strftime('%Y-%m-%d') }}"
          to_date: "{{ now().strftime('%Y-%m-%d') }}"
        response_variable: report
    sensor:
      - name: PilotLive Valley Brewery Department Sales
        unique_id: pilotlive_valley_brewery_department_sales
        state: "{{ now().isoformat() }}"
        attributes:
          rows: "{{ report['sensor.pilotlive_valley_brewery'].rows }}"
