# Example Lovelace card for a PilotLive store sensor.
#
# Home Assistant doesn't support per-attribute icons on an entity, but the
# built-in "entities" card lets each row target a specific attribute of the
# same sensor and override its icon/name individually.
#
# Replace "sensor.pilotlive_valley_brewery" below with your store's actual
# entity ID.

type: entities
title: PilotLive Valley Brewery
show_header_toggle: false
entities:
  - entity: sensor.pilotlive_valley_brewery
    name: Status
  - entity: sensor.pilotlive_valley_brewery
    attribute: Total Monthly Sales
    name: Total Monthly Sales
    icon: mdi:cash-multiple
  - entity: sensor.pilotlive_valley_brewery
    attribute: Daily Sales
    name: Daily Sales
    icon: mdi:cash
  - entity: sensor.pilotlive_valley_brewery
    attribute: Year on Year
    name: Year on Year
    icon: mdi:calendar-sync
  - entity: sensor.pilotlive_valley_brewery
    attribute: Projected Growth
    name: Projected Growth
    icon: mdi:trending-up
  - entity: sensor.pilotlive_valley_brewery
    attribute: Open Tables
    name: Open Tables
    icon: mdi:table-furniture
  - entity: sensor.pilotlive_valley_brewery
    attribute: Discounts
    name: Discounts
    icon: mdi:sale
  - entity: sensor.pilotlive_valley_brewery
    attribute: Ticket Claims
    name: Ticket Claims
    icon: mdi:receipt-text-check
  - entity: sensor.pilotlive_valley_brewery
    attribute: Voids
    name: Voids
    icon: mdi:cancel
  - entity: sensor.pilotlive_valley_brewery
    attribute: Payouts
    name: Payouts
    icon: mdi:cash-refund
  - entity: sensor.pilotlive_valley_brewery
    attribute: Last Connection
    name: Last Connection
    icon: mdi:clock-outline
